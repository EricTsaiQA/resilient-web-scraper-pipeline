name: Scheduled Resilient Scraper & Diff Pipeline

on:
  schedule:
    - cron: "0 1 * * *"  # Daily at 09:00 Asia/Taipei (UTC+8)
  workflow_dispatch:

jobs:
  run-etl-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit & Diff Pipeline Tests
        run: pytest -v

      - name: Execute End-to-End Demo ETL & Generate Reports
        run: python examples/run_demo_pipeline.py

      - name: Upload CSV & Styled Excel Reports
        uses: actions/upload-artifact@v4
        with:
          name: directory-diff-reports
          path: examples/output/
